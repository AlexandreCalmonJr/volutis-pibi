services:
  postgres:
    image: postgres:16
    container_name: volutis_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-volutis}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  waha:
    image: devlikeapro/waha:latest
    container_name: volutis_waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_LOG_LEVEL=info
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-changeme}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
    volumes:
      - waha_sessions:/app/.sessions

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volutis_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/volutis?schema=public}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no .env}
      - WHATSAPP_API_URL=http://waha:3000
      - WHATSAPP_SESSION=${WHATSAPP_SESSION:-default}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      - postgres
      - waha
    volumes:
      - app_data:/app/server/data

volumes:
  postgres_data:
  waha_sessions:
  app_data:
