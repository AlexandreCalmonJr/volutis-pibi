services:
  waha:
    image: devlikeapro/waha:latest
    container_name: volutis_waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_LOG_LEVEL=info
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-changeme}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
    volumes:
      - waha_sessions:/app/.sessions

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volutis_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no .env}
      - WHATSAPP_API_URL=http://waha:3000
      - WHATSAPP_SESSION=${WHATSAPP_SESSION:-default}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      - waha
    volumes:
      - app_data:/app/server/data

volumes:
  waha_sessions:
  app_data:
